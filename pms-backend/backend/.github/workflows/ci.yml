name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pms, POSTGRES_PASSWORD: pms_dev_pw, POSTGRES_DB: pms_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pms:pms_dev_pw@localhost:5432/pms_test
      JWT_ACCESS_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
